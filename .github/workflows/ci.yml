name: Continuous Integration & QA Audit

on:
  push:
    branches: [ main, integrasi-total, 'sprint-*' ]
  pull_request:
    branches: [ main, integrasi-total ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Run Unit Tests (Vitest)
        run: npm run test:unit

      - name: Run Full End-to-End QA Regression Suite
        run: npm run test:qa

      - name: Run UI/UX and Mobile Accessibility Audit
        run: npm run test:uiux

      - name: Check Wiring Contract
        run: npm run qa:wiring || echo "Wiring audit backlog identified"
