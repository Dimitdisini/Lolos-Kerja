name: Scheduled Job Sourcing & Normalization

on:
  schedule:
    # Runs at 01:00 UTC (08:00 WIB) every day
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-scraper-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        continue-on-error: true

      - name: Install Scraping Dependencies
        run: |
          pip install --upgrade pip
          pip install python-jobspy requests || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JobSpy & Open API Ingestion
        run: |
          if [ -f scripts/scrape/jobspy_fetcher.py ]; then
            python3 scripts/scrape/jobspy_fetcher.py || echo "JobSpy fetch completed with notice."
          fi

      - name: Run Normalization & Supabase Ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -f scripts/scrape/run.js ]; then
            node scripts/scrape/run.js
          else
            echo "Scraper script not yet invoked; standby for live runs."
          fi
