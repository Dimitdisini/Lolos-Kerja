name: Smart Drip Auto-Blast Execution Tick

on:
  schedule:
    # Runs every 5 minutes during business hours (01:00 UTC - 10:00 UTC / 08:00 - 17:00 WIB)
    - cron: '*/5 1-10 * * 1-5'
  workflow_dispatch:

jobs:
  trigger-blast-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Blast Tick API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL || 'https://ai.fleekgroup.id' }}
        run: |
          echo "Triggering secure blast execution tick..."
          curl -s -X POST "${APP_URL}/api/blast/tick" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" || echo "API trigger completed."
